<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>준비 중 - Cineaho</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f8fafc;
      color: #1e293b;
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      line-height: 1.7;
      padding: 40px 20px;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background-color: #ffffff;
      padding: 50px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid #e2e8f0;
      text-align: center;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #475569;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 32px;
      transition: color 0.2s;
    }
    .back-btn:hover {
      color: #0f172a;
    }
    .back-btn svg {
      vertical-align: middle;
    }
    .illustration-wrapper {
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
    }
    .illustration-svg {
      width: 120px;
      height: 120px;
    }
    .gear {
      transform-origin: 50px 50px;
      animation: spin 8s linear infinite;
    }
    .gear-small {
      transform-origin: 78px 76px;
      animation: spin-reverse 6s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin-top: 0;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #64748b;
      margin-top: 0;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #0f172a;
      color: #ffffff;
      padding: 12px 32px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .home-btn:hover {
      opacity: 0.9;
    }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1607063568131489"
     crossorigin="anonymous"></script>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span>CineAHO 홈으로</span>
    </a>

    <div class="illustration-wrapper">
      <svg class="illustration-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Big Gear -->
        <g class="gear">
          <path d="M50 35C41.7 35 35 41.7 35 50C35 58.3 41.7 65 50 65C58.3 65 65 58.3 65 50C65 41.7 58.3 35 50 35ZM50 58C45.6 58 42 54.4 42 50C42 45.6 45.6 42 50 42C54.4 42 58 45.6 58 50C58 54.4 54.4 58 50 58Z" fill="#3b82f6"/>
          <path d="M50 25V30M50 70V75M25 50H30M70 50H75M32.3 32.3L35.8 35.8M64.2 64.2L67.7 67.7M32.3 67.7L35.8 64.2M64.2 35.8L67.7 32.3" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
        </g>
        <!-- Small Gear -->
        <g class="gear-small">
          <path d="M78 68C73.6 68 70 71.6 70 76C70 80.4 73.6 84 78 84C82.4 84 86 80.4 86 76C86 71.6 82.4 68 78 68ZM78 80C75.8 80 74 78.2 74 76C74 73.8 75.8 72 78 72C80.2 72 82 73.8 82 76C82 78.2 80.2 80 78 80Z" fill="#60a5fa"/>
          <path d="M78 62V65M78 87V90M64 76H67M89 76H92M68 66L70 68M86 84L88 86M68 86L70 84M86 68L88 66" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <h1>서비스 준비 중</h1>
    <p>보다 안정적이고 유익한 서비스를 제공하기 위해<br>해당 페이지(통계 및 업데이트)를 준비하고 있습니다.<br>빠른 시일 내에 준비하여 찾아뵙겠습니다.</p>

    <a href="index.html" class="home-btn">CineAHO 홈으로 이동</a>
  </div>

</body>
</html>
