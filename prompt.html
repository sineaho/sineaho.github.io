<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 프롬프트/페르소나 큐레이터 - CineAHO's SandBox</title>
  <!-- Google Fonts Outfit, Inter, Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Custom styles for Prompt Curation Page */
    body {
      background-color: #060913;
      color: #f1f5f9;
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      line-height: 1.6;
      padding: 40px 20px;
      margin: 0;
    }

    .prompt-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Back Button */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 14.5px;
      font-weight: 600;
      margin-bottom: 32px;
      transition: var(--transition-smooth);
    }
    .back-btn:hover {
      color: #ffffff;
      transform: translateX(-4px);
    }

    /* Page Header */
    .prompt-page-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .prompt-page-header h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 8px;
      color: #ffffff;
    }
    .prompt-page-header h1 i {
      background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .prompt-page-header p {
      font-size: 16px;
      color: #94a3b8;
      margin: 0;
    }

    /* Recommendation Banner */
    .recommendation-banner {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 16px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 40px;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.05);
    }
    .recommendation-banner i {
      font-size: 20px;
      color: #60a5fa;
      flex-shrink: 0;
    }
    .recommendation-banner p {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
      color: #cbd5e1;
    }
    .recommendation-banner a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px dashed #60a5fa;
      transition: color 0.2s;
    }
    .recommendation-banner a:hover {
      color: #93c5fd;
      border-bottom-style: solid;
    }

    /* Filter Toolbar */
    .filter-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 30px;
      background: rgba(14, 20, 38, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 16px 24px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-wrapper {
      position: relative;
    }
    .search-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 14px;
    }
    .search-input {
      background-color: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      padding: 10px 16px 10px 40px;
      border-radius: 30px;
      font-size: 14px;
      width: 240px;
      transition: var(--transition-smooth);
      outline: none;
    }
    .search-input:focus {
      border-color: #a855f7;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.15);
      width: 280px;
    }

    .category-select {
      background-color: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
      transition: var(--transition-smooth);
    }
    .category-select:focus {
      border-color: #a855f7;
    }

    .layout-toggle {
      display: flex;
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 30px;
      padding: 3px;
    }
    .layout-btn {
      background: none;
      border: none;
      color: #64748b;
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }
    .layout-btn.active {
      background-color: #7c3aed;
      color: #ffffff;
    }

    .toolbar-right {
      font-size: 14.5px;
      color: #94a3b8;
    }
    .toolbar-right span {
      font-weight: 700;
      color: #a855f7;
    }

    /* Prompts Grid/List Container */
    .prompts-wrapper {
      display: grid;
      gap: 24px;
      transition: all 0.3s ease;
    }
    .prompts-wrapper.grid-mode {
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    }
    .prompts-wrapper.list-mode {
      grid-template-columns: 1fr;
    }

    /* Prompt Card */
    .prompt-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      padding: 24px;
      background: rgba(14, 20, 38, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      transition: var(--transition-smooth);
      position: relative;
      overflow: hidden;
    }
    .prompt-card:hover {
      transform: translateY(-4px);
      border-color: rgba(168, 85, 247, 0.3);
      box-shadow: 0 12px 30px rgba(168, 85, 247, 0.08);
    }
    .prompts-wrapper.list-mode .prompt-card {
      flex-direction: row;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 16px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }
    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .path-category {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
    }
    .badge-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .badge-text {
      background-color: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.25);
    }
    .badge-video {
      background-color: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.25);
    }
    .badge-audio {
      background-color: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.25);
    }
    .badge-image {
      background-color: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .badge-analysis {
      background-color: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .copy-btn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .copy-btn:hover {
      background-color: #1d4ed8;
      transform: scale(1.05);
    }
    .copy-btn:active {
      transform: scale(0.95);
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .card-body h3 {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
      line-height: 1.4;
    }
    .card-desc {
      font-size: 13.5px;
      color: #94a3b8;
      margin: 0;
      line-height: 1.5;
    }
    .card-usage {
      font-size: 13px;
      color: #c084fc;
      margin: 0;
      background: rgba(168, 85, 247, 0.05);
      padding: 8px 12px;
      border-radius: 8px;
      border-left: 3px solid #a855f7;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
    }
    .tag {
      font-size: 11px;
      color: #cbd5e1;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 3px 8px;
      border-radius: 6px;
    }

    /* Details Toggle Button */
    .card-footer {
      width: 100%;
      margin-top: 10px;
    }
    .toggle-details-btn {
      width: 100%;
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #a855f7;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .toggle-details-btn:hover {
      background-color: rgba(168, 85, 247, 0.08);
      border-color: rgba(168, 85, 247, 0.3);
    }
    .toggle-details-btn.expanded {
      background-color: rgba(168, 85, 247, 0.05);
      border-color: #a855f7;
      color: #ffffff;
    }

    /* Collapsible Details Container */
    .prompt-details-container {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), padding 0.3s ease;
      background-color: #04060c;
      border-radius: 12px;
      border: 0 solid rgba(255, 255, 255, 0.05);
      margin-top: 0;
    }
    .prompt-details-container.expanded {
      max-height: 480px;
      overflow-y: auto;
      border-width: 1px;
      margin-top: 14px;
      padding: 20px;
    }

    /* Markdown styling inside details */
    .prompt-details-content {
      font-size: 13.5px;
      color: #cbd5e1;
      font-family: var(--font-main);
    }
    .prompt-details-content h4.md-h2 {
      font-size: 15px;
      font-weight: 700;
      color: #a855f7;
      margin-top: 18px;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(168, 85, 247, 0.15);
      padding-bottom: 6px;
    }
    .prompt-details-content h5.md-h3 {
      font-size: 14px;
      font-weight: 700;
      color: #60a5fa;
      margin-top: 14px;
      margin-bottom: 6px;
    }
    .prompt-details-content p.md-p {
      margin: 0 0 10px 0;
      line-height: 1.6;
    }
    .prompt-details-content ul, .prompt-details-content ol {
      margin: 0 0 12px 0;
      padding-left: 20px;
    }
    .prompt-details-content li {
      margin-bottom: 4px;
    }
    .prompt-details-content strong {
      color: #f1f5f9;
      font-weight: 600;
    }
    .prompt-details-content hr.prompt-hr {
      border: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 16px 0;
    }
    .prompt-details-content .spacer {
      height: 10px;
    }
    
    .code-block {
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin: 10px 0;
    }
    .code-block code {
      font-family: monospace;
      font-size: 12.5px;
      color: #34d399;
    }

    .prompt-table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 12.5px;
    }
    .prompt-table th, .prompt-table td {
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 10px;
      text-align: left;
    }
    .prompt-table th {
      background: rgba(255, 255, 255, 0.03);
      font-weight: 600;
      color: #ffffff;
    }
    .prompt-table td {
      color: #cbd5e1;
    }

    /* Toast Notification */
    .toast-notification {
      position: fixed;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
      color: #ffffff;
      padding: 12px 28px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 8px 30px rgba(124, 58, 237, 0.3);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .toast-notification.show {
      bottom: 40px;
      opacity: 1;
    }

    /* Light Theme Support */
    [data-theme="light"] body {
      background-color: #f8fafc;
      color: #0f172a;
    }
    [data-theme="light"] .prompt-page-header h1 {
      color: #0f172a;
    }
    [data-theme="light"] .recommendation-banner {
      background: rgba(255, 255, 255, 0.8);
      border-color: rgba(59, 130, 246, 0.15);
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.05);
      color: #334155;
    }
    [data-theme="light"] .recommendation-banner p {
      color: #334155;
    }
    [data-theme="light"] .filter-toolbar {
      background: rgba(255, 255, 255, 0.8);
      border-color: rgba(0, 0, 0, 0.05);
    }
    [data-theme="light"] .search-input,
    [data-theme="light"] .category-select,
    [data-theme="light"] .layout-toggle {
      background-color: #ffffff;
      border-color: #e2e8f0;
      color: #0f172a;
    }
    [data-theme="light"] .search-input:focus {
      border-color: #7c3aed;
    }
    [data-theme="light"] .prompt-card {
      background: rgba(255, 255, 255, 0.8);
      border-color: rgba(0, 0, 0, 0.05);
    }
    [data-theme="light"] .prompt-card:hover {
      box-shadow: 0 12px 30px rgba(124, 58, 237, 0.06);
    }
    [data-theme="light"] .card-body h3 {
      color: #0f172a;
    }
    [data-theme="light"] .card-desc {
      color: #475569;
    }
    [data-theme="light"] .tag {
      background-color: rgba(0, 0, 0, 0.03);
      border-color: rgba(0, 0, 0, 0.06);
      color: #475569;
    }
    [data-theme="light"] .toggle-details-btn {
      border-color: #e2e8f0;
    }
    [data-theme="light"] .toggle-details-btn.expanded {
      background-color: rgba(168, 85, 247, 0.05);
      color: #7c3aed;
    }
    [data-theme="light"] .prompt-details-container {
      background-color: #f1f5f9;
      border-color: #e2e8f0;
    }
    [data-theme="light"] .prompt-details-content {
      color: #334155;
    }
    [data-theme="light"] .prompt-details-content strong {
      color: #0f172a;
    }
    [data-theme="light"] .code-block {
      background-color: #e2e8f0;
      border-color: #cbd5e1;
    }
    [data-theme="light"] .code-block code {
      color: #047857;
    }
    [data-theme="light"] .prompt-table th {
      background-color: rgba(0, 0, 0, 0.03);
      color: #0f172a;
    }
    [data-theme="light"] .prompt-table th, 
    [data-theme="light"] .prompt-table td {
      border-color: #cbd5e1;
    }
    [data-theme="light"] .prompt-table td {
      color: #334155;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .filter-toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .toolbar-left {
        flex-direction: column;
        align-items: stretch;
      }
      .search-input {
        width: 100%;
      }
      .search-input:focus {
        width: 100%;
      }
      .category-select {
        width: 100%;
      }
      .layout-toggle {
        justify-content: center;
      }
      .toolbar-right {
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient background glow effects matching sitemap -->
  <div class="bg-glow bg-glow-purple" style="top: 10%; left: -10%;"></div>
  <div class="bg-glow bg-glow-blue" style="top: 50%; right: -10%;"></div>

  <div class="prompt-container">
    
    <!-- Back Button -->
    <a href="index.html" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>CineAHO 홈으로</span>
    </a>

    <!-- Page Header -->
    <header class="prompt-page-header">
      <h1><i class="fa-solid fa-wand-magic-sparkles"></i> AI 프롬프트/페르소나 큐레이터</h1>
      <p>실제 작동하는 고품질 AI 에이전트 및 글쓰기/이미지/음악 작곡 프롬프트를 검색하고 복사하세요.</p>
    </header>

    <!-- Recommendation Banner -->
    <section class="recommendation-banner">
      <i class="fa-solid fa-lightbulb"></i>
      <p>
        <strong>AI 프로그램 및 엔진 추천:</strong> <a href="https://www.genspark.ai" target="_blank">젠스파크(Genspark)</a> - 대본 및 기획과 글쓰기에는 클로드 오푸스 4.5 또는 소네트 4.5를 추천합니다. (1만자/3만자/10만자 가능, 작문 매우 뛰어남)
      </p>
    </section>

    <!-- Filter Toolbar -->
    <div class="filter-toolbar">
      <div class="toolbar-left">
        <div class="search-wrapper">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="prompt-search" class="search-input" placeholder="검색...">
        </div>

        <select id="category-filter" class="category-select">
          <option value="all">모든 카테고리</option>
        </select>

        <div class="layout-toggle">
          <button class="layout-btn active" id="btn-grid" title="그리드 뷰">
            <i class="fa-solid fa-table-cells-large"></i>
          </button>
          <button class="layout-btn" id="btn-list" title="리스트 뷰">
            <i class="fa-solid fa-list"></i>
          </button>
        </div>
      </div>

      <div class="toolbar-right">
        총 <span id="count-val">0</span>개 프롬프트
      </div>
    </div>

    <!-- Prompts wrapper -->
    <div class="prompts-wrapper grid-mode" id="prompts-list">
      <!-- Dynamic prompt cards will load here -->
    </div>

  </div>

  <!-- Toast Notification -->
  <div class="toast-notification" id="copy-toast">
    <i class="fa-solid fa-circle-check"></i>
    <span>프롬프트가 클립보드에 복사되었습니다!</span>
  </div>

  <script>
    // In-memory prompts data
    let promptsData = [];
    const promptsListEl = document.getElementById('prompts-list');
    const categoryFilterEl = document.getElementById('category-filter');
    const searchInputEl = document.getElementById('prompt-search');
    const countValEl = document.getElementById('count-val');
    const btnGrid = document.getElementById('btn-grid');
    const btnList = document.getElementById('btn-list');
    const copyToast = document.getElementById('copy-toast');

    // Layout configuration
    btnGrid.addEventListener('click', () => {
      btnGrid.classList.add('active');
      btnList.classList.remove('active');
      promptsListEl.className = 'prompts-wrapper grid-mode';
    });

    btnList.addEventListener('click', () => {
      btnList.classList.add('active');
      btnGrid.classList.remove('active');
      promptsListEl.className = 'prompts-wrapper list-mode';
    });

    // Load Prompts Data
    fetch('prompt/prompts-data.json')
      .then(res => res.json())
      .then(data => {
        promptsData = data;
        populateCategories(data);
        renderPrompts(data);
      })
      .catch(err => {
        console.error("Failed to load prompts data", err);
        promptsListEl.innerHTML = `<div style="text-align:center; padding:40px; color:#f87171;">프롬프트 데이터를 불러오는 데 실패했습니다.</div>`;
      });

    // Populate categories drop-down
    function populateCategories(data) {
      const categories = new Set();
      data.forEach(item => {
        if (item.category) {
          categories.add(item.category);
        }
      });

      categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        categoryFilterEl.appendChild(opt);
      });
    }

    // Render cards
    function renderPrompts(data) {
      promptsListEl.innerHTML = '';
      countValEl.textContent = data.length;

      if (data.length === 0) {
        promptsListEl.innerHTML = `<div style="text-align:center; padding:40px; color:#64748b; width:100%; grid-column: 1 / -1;">검색 결과가 없습니다.</div>`;
        return;
      }

      data.forEach(prompt => {
        const card = document.createElement('div');
        card.className = 'prompt-card';
        card.setAttribute('data-id', prompt.id);

        // Map badge type to CSS class
        let badgeClass = 'badge-text';
        if (prompt.badge === '비디오') badgeClass = 'badge-video';
        if (prompt.badge === '오디오') badgeClass = 'badge-audio';
        if (prompt.badge === '이미지') badgeClass = 'badge-image';
        if (prompt.badge === '분석') badgeClass = 'badge-analysis';

        // Format tags
        const tagsHtml = prompt.tags.map(t => `<span class="tag">#${t}</span>`).join(' ');

        card.innerHTML = `
          <div class="card-top">
            <div class="card-meta">
              <span class="path-category">${prompt.category}</span>
              <div class="badge-row">
                <span class="badge ${badgeClass}">${prompt.badge}</span>
              </div>
            </div>
            <button class="copy-btn" title="프롬프트 텍스트 복사" onclick="copyPrompt('${prompt.id}')">
              <i class="fa-solid fa-copy"></i>
            </button>
          </div>
          <div class="card-body">
            <h3>${prompt.title}</h3>
            <p class="card-desc">${prompt.description}</p>
            <div class="card-usage"><strong>용도:</strong> ${prompt.usage}</div>
          </div>
          <div class="card-tags">
            ${tagsHtml}
          </div>
          <div class="card-footer">
            <button class="toggle-details-btn" onclick="toggleDetails('${prompt.id}', this)">
              <i class="fa-solid fa-chevron-down"></i>
              <span>전체 내용 보기</span>
            </button>
            <div class="prompt-details-container" id="details-${prompt.id}">
              <div class="prompt-details-content">
                ${renderMarkdown(prompt.markdown)}
              </div>
            </div>
          </div>
        `;

        promptsListEl.appendChild(card);
      });
    }

    // Toggle card expansion
    window.toggleDetails = function(id, btn) {
      const container = document.getElementById(`details-${id}`);
      const isExpanded = container.classList.contains('expanded');
      
      if (isExpanded) {
        container.classList.remove('expanded');
        btn.classList.remove('expanded');
        btn.querySelector('span').textContent = '전체 내용 보기';
        btn.querySelector('i').className = 'fa-solid fa-chevron-down';
      } else {
        container.classList.add('expanded');
        btn.classList.add('expanded');
        btn.querySelector('span').textContent = '접기';
        btn.querySelector('i').className = 'fa-solid fa-chevron-up';
      }
    };

    // Copy Prompt Text Function
    window.copyPrompt = function(id) {
      const prompt = promptsData.find(p => p.id === id);
      if (!prompt) return;

      navigator.clipboard.writeText(prompt.markdown).then(() => {
        // Show Toast
        copyToast.classList.add('show');
        setTimeout(() => {
          copyToast.classList.remove('show');
        }, 2500);
      }).catch(err => {
        console.error("Failed to copy", err);
        alert("복사 실패했습니다.");
      });
    };

    // Filter Logic
    function applyFilters() {
      const query = searchInputEl.value.toLowerCase().trim();
      const category = categoryFilterEl.value;

      const filtered = promptsData.filter(prompt => {
        const matchesCategory = (category === 'all' || prompt.category === category);
        
        const titleMatch = prompt.title.toLowerCase().includes(query);
        const descMatch = prompt.description.toLowerCase().includes(query);
        const usageMatch = prompt.usage.toLowerCase().includes(query);
        const tagMatch = prompt.tags.some(tag => tag.toLowerCase().includes(query));
        const contentMatch = prompt.markdown.toLowerCase().includes(query);

        const matchesSearch = titleMatch || descMatch || usageMatch || tagMatch || contentMatch;

        return matchesCategory && matchesSearch;
      });

      renderPrompts(filtered);
    }

    searchInputEl.addEventListener('input', applyFilters);
    categoryFilterEl.addEventListener('change', applyFilters);

    // Markdown Parser implementation
    function renderMarkdown(md) {
      if (!md) return '';
      
      // Escape HTML to prevent injection and formatting breakage
      let html = md
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
        
      // Code blocks
      html = html.replace(/```([\s\S]*?)```/g, (match, code) => {
        return `<pre class="code-block"><code>${code.trim()}</code></pre>`;
      });
      
      // Horizontal rules
      html = html.replace(/^---$/gm, '<hr class="prompt-hr">');
      
      // Headings
      html = html.replace(/^## (.*?)$/gm, '<h4 class="md-h2">$1</h4>');
      html = html.replace(/^### (.*?)$/gm, '<h5 class="md-h3">$1</h5>');
      
      // Bold text
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      
      // Bullet lists
      let inUl = false;
      const lines = html.split('\n');
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const bulletMatch = line.match(/^(\*|-)\s+(.*)$/);
        if (bulletMatch) {
          let content = bulletMatch[2];
          if (!inUl) {
            lines[i] = '<ul><li>' + content + '</li>';
            inUl = true;
          } else {
            lines[i] = '<li>' + content + '</li>';
          }
        } else {
          if (inUl) {
            lines[i - 1] += '</ul>';
            inUl = false;
          }
        }
      }
      if (inUl) {
        lines[lines.length - 1] += '</ul>';
      }
      html = lines.join('\n');
      
      // Numbered lists
      let inOl = false;
      const olLines = html.split('\n');
      for (let i = 0; i < olLines.length; i++) {
        const line = olLines[i];
        const numMatch = line.match(/^\d+\.\s+(.*)$/);
        if (numMatch) {
          let content = numMatch[1];
          if (!inOl) {
            olLines[i] = '<ol><li>' + content + '</li>';
            inOl = true;
          } else {
            olLines[i] = '<li>' + content + '</li>';
          }
        } else {
          if (inOl) {
            olLines[i - 1] += '</ol>';
            inOl = false;
          }
        }
      }
      if (inOl) {
        olLines[olLines.length - 1] += '</ol>';
      }
      html = olLines.join('\n');

      // Simple tables
      let inTable = false;
      const tableLines = html.split('\n');
      let currentTable = [];
      for (let i = 0; i < tableLines.length; i++) {
        const line = tableLines[i].trim();
        if (line.startsWith('|') && line.endsWith('|')) {
          if (!inTable) {
            inTable = true;
            currentTable = [line];
            tableLines[i] = '';
          } else {
            currentTable.push(line);
            tableLines[i] = '';
          }
        } else {
          if (inTable) {
            tableLines[i - 1] = formatTableHTML(currentTable);
            inTable = false;
          }
        }
      }
      if (inTable) {
        tableLines[tableLines.length - 1] = formatTableHTML(currentTable);
      }
      html = tableLines.join('\n');

      // Convert linebreaks to paragraphs
      html = html.split('\n').map(line => {
        const trimmed = line.trim();
        if (!trimmed) return '<div class="spacer"></div>';
        if (trimmed.startsWith('<h') || trimmed.startsWith('<u') || trimmed.startsWith('<o') || trimmed.startsWith('<l') || trimmed.startsWith('</u') || trimmed.startsWith('</o') || trimmed.startsWith('<p') || trimmed.startsWith('<d') || trimmed.startsWith('<t') || trimmed.startsWith('</t') || trimmed.startsWith('<b')) {
          return line;
        }
        return `<p class="md-p">${line}</p>`;
      }).join('\n');
      
      return html;
    }

    function formatTableHTML(rows) {
      let tableHtml = '<table class="prompt-table"><thead>';
      let bodyStarted = false;
      
      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const cells = row.split('|').map(c => c.trim()).filter((c, idx, arr) => idx > 0 && idx < arr.length - 1);
        
        if (cells.every(c => c.startsWith('-'))) {
          tableHtml += '</thead><tbody>';
          bodyStarted = true;
          continue;
        }
        
        tableHtml += '<tr>';
        for (const cell of cells) {
          if (bodyStarted) {
            tableHtml += `<td>${cell}</td>`;
          } else {
            tableHtml += `<th>${cell}</th>`;
          }
        }
        tableHtml += '</tr>';
      }
      
      if (!bodyStarted) {
        tableHtml += '</thead>';
      } else {
        tableHtml += '</tbody>';
      }
      
      tableHtml += '</table>';
      return tableHtml;
    }
  </script>
</body>
